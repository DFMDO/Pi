# DFM: WLAN-Energiesparen dauerhaft AUS (stabile Verbindung), keine zufälligen MAC-Adressen beim Scannen
[main]
plugins=keyfile
# KEIN "no-auto-default=*": Sonst legt NetworkManager für das Netzwerkkabel kein Profil an und eth0 bekommt nie eine Adresse (im Pilot: Kabel steckt, Link da, aber keine Verbindung).

[connection]
wifi.powersave=2

[device]
wifi.scan-rand-mac-address=no

[keyfile]
unmanaged-devices=none
