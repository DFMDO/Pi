# Hub: nur 443 (Admin-UI, API, WSS, Medien), 80 (Weiterleitung), 123/UDP (NTP), 5353/UDP (mDNS)
flush ruleset
table inet dfm { chain input { type filter hook input priority 0; policy drop;
  iif lo accept; ct state established,related accept; ct state invalid drop
  ip protocol icmp icmp type { echo-request, destination-unreachable, time-exceeded } limit rate 10/second accept
  tcp dport { 80, 443 } accept; udp dport { 123, 5353 } accept; udp sport 67 udp dport 68 accept } }
