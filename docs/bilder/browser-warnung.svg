<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 350" font-family="system-ui,Segoe UI,Arial,sans-serif" role="img" aria-label="Drei Schritte: Warnung öffnen, Erweitert wählen, Fingerabdruck vergleichen">
<rect width="880" height="350" rx="14" fill="#f5f5f3"/>
<g transform="translate(10,20)"><rect width="270" height="300" rx="12" fill="#fff" stroke="#c9c9c2" stroke-width="2"/><circle cx="26" cy="28" r="16" fill="#c8102e"/><text x="26" y="34" text-anchor="middle" font-size="18" font-weight="800" fill="#fff">1</text><text x="52" y="34" font-size="16" font-weight="700" fill="#1a1a1a">Die Warnung ist normal</text><text x="20" y="80" font-size="40">⚠️</text><text x="20" y="125" font-size="15" font-weight="700" fill="#1a1a1a">Ihre Verbindung ist nicht</text><text x="20" y="145" font-size="15" font-weight="700" fill="#1a1a1a">privat / nicht sicher</text><text x="20" y="180" font-size="13" fill="#555">Der Hub hat ein eigenes Zertifikat,</text><text x="20" y="198" font-size="13" fill="#555">weil er ohne Internet arbeitet.</text><rect x="20" y="235" width="130" height="38" rx="8" fill="#c8102e" stroke="#c8102e" stroke-width="2"/><text x="85" y="260" text-anchor="middle" font-size="15" font-weight="600" fill="#fff">Erweitert</text></g>
<g transform="translate(305,20)"><rect width="270" height="300" rx="12" fill="#fff" stroke="#c9c9c2" stroke-width="2"/><circle cx="26" cy="28" r="16" fill="#c8102e"/><text x="26" y="34" text-anchor="middle" font-size="18" font-weight="800" fill="#fff">2</text><text x="52" y="34" font-size="16" font-weight="700" fill="#1a1a1a">Weiter zum Hub</text><text x="20" y="78" font-size="14" fill="#555">Adresse: dfm-signage.local</text><rect x="20" y="100" width="230" height="38" rx="8" fill="#c8102e" stroke="#c8102e" stroke-width="2"/><text x="135" y="125" text-anchor="middle" font-size="15" font-weight="600" fill="#fff">Weiter zu dfm-signage.local</text><text x="20" y="175" font-size="13" fill="#555">(Safari: „Webseite besuchen“,</text><text x="20" y="193" font-size="13" fill="#555">Firefox: „Risiko akzeptieren“)</text><text x="20" y="250" font-size="13" fill="#1a1a1a" font-weight="700">Noch nicht anmelden – erst prüfen!</text></g>
<g transform="translate(600,20)"><rect width="270" height="300" rx="12" fill="#fff" stroke="#c9c9c2" stroke-width="2"/><circle cx="26" cy="28" r="16" fill="#c8102e"/><text x="26" y="34" text-anchor="middle" font-size="18" font-weight="800" fill="#fff">3</text><text x="52" y="34" font-size="16" font-weight="700" fill="#1a1a1a">Fingerabdruck vergleichen</text><text x="20" y="78" font-size="13" fill="#555">Im Hub (Hub-Adresse &amp; Fingerabdruck):</text><text x="20" y="108" font-size="15" font-family="ui-monospace,monospace" font-weight="700" fill="#1a1a1a">A3F2 91C0 7B44 D8E1</text><text x="20" y="130" font-size="15" font-family="ui-monospace,monospace" font-weight="700" fill="#1a1a1a">5C6A 0F73 B2E9 1D88 …</text><text x="20" y="175" font-size="13" fill="#555">= Anzeige am Hub / Druckkarte?</text><text x="20" y="215" font-size="14" fill="#1b7f3b" font-weight="700">✔ gleich → weiter</text><text x="20" y="240" font-size="14" fill="#b00020" font-weight="700">✖ anders → stoppen, IT rufen</text></g>
</svg>