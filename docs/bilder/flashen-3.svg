<text x="70" y="44" font-size="22" font-weight="700" fill="#1a1a1a">Wichtig: KEINE Einstellungen vorgeben</text><rect x="130" y="90" width="380" height="150" rx="10" fill="#fff" stroke="#999"/><text x="150" y="125" font-size="17" fill="#1a1a1a" font-weight="700">Möchten Sie die Einstellungen anpassen?</text><text x="150" y="150" font-size="14" fill="#555">Das Image braucht keine Vorgaben (kein WLAN, kein Benutzer).</text><rect x="150" y="175" width="160" height="44" rx="8" fill="#c8102e" stroke="#c8102e" stroke-width="2"/><text x="230" y="203" text-anchor="middle" font-size="17" font-weight="600" fill="#fff">NEIN</text><rect x="330" y="175" width="160" height="44" rx="8" fill="#fff" stroke="#999" stroke-width="2"/><text x="410" y="203" text-anchor="middle" font-size="17" font-weight="600" fill="#1a1a1a">Einstellungen</text><text x="320" y="300" text-anchor="middle" font-size="15" fill="#444">Alles wird später am Handy eingerichtet.</text>
<text x="620" y="346" text-anchor="end" font-size="11" fill="#777">Schematische Darstellung – Aussehen des Programms kann abweichen</text></svg>